<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in | GoLocal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <main class="container form-page">
    <div class="form-card">
      <h1 id="state-title" data-i18n="auth.signingIn">Signing you in</h1>
      <p id="state-text" data-i18n="auth.signingInText">One moment.</p>
      <div class="alert alert-error" id="form-error" hidden></div>
      <p class="form-footer" id="retry" hidden>
        <a href="login.html" data-i18n="auth.backToLogin">Back to log in</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-callback.js"></script>
</body>
</html>
