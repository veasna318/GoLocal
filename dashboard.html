<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | GoLocal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <div id="site-header"></div>

  <section class="page-header">
    <div class="container">
      <h1 data-i18n="dash.title">Seller Dashboard</h1>
      <p data-i18n="dash.sub"></p>
    </div>
  </section>

  <main class="container section">
    <div id="verification-notice"></div>

    <div class="dash-head">
      <h2 data-i18n="dash.myProducts">My Products</h2>
      <a href="product-form.html" class="btn btn-green" id="add-button" data-i18n="dash.addProduct">Add Product</a>
    </div>

    <div id="product-list"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
