<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | GoLocal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container form-page">
    <div class="form-card">
      <h1 data-i18n="auth.loginTitle">Welcome back</h1>
      <p data-i18n="auth.loginSub"></p>

      <form id="login-form">
        <div class="alert alert-error" id="form-error" hidden></div>

        <div class="field">
          <label for="email" data-i18n="auth.email">Email</label>
          <input class="input" type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="field">
          <label for="password" data-i18n="auth.password">Password</label>
          <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-green btn-block" id="submit-button" data-i18n="auth.login">Log in</button>
      </form>

      <div class="or-line"><span data-i18n="auth.or">or</span></div>

      <button type="button" class="btn btn-outline btn-block google-button" id="google-button">
        <svg class="g-mark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.3z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.2 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.7-.7-4.3s.3-3 .7-4.3v-5.7H4.5C2.9 17.1 2 20.4 2 24s.9 6.9 2.5 10l7.3-5.7z"/><path fill="#EA4335" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.5 2 8.1 6.8 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/></svg><span data-i18n="auth.google">Continue with Google</span>
      </button>

      <p class="form-footer">
        <span data-i18n="auth.noAccount">No account yet?</span>
        <a href="signup.html" data-i18n="auth.signup">Sign up</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('form-error');
    const button = document.getElementById('submit-button');

    // Google sends the visitor away and back, so the page cannot keep
    // state. Where they were heading is saved before leaving.
    document.getElementById('google-button').addEventListener('click', async () => {
      errorBox.hidden = true;
      try {
        await signInWithGoogle({ next: new URLSearchParams(location.search).get('next') });
      } catch (error) {
        errorBox.textContent = authErrorText(error);
        errorBox.hidden = false;
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      button.disabled = true;
      button.textContent = t('auth.working');

      try {
        await signIn(form.email.value.trim(), form.password.value);
        const next = new URLSearchParams(location.search).get('next');
        location.href = next || (isSeller() || isAdmin() ? 'dashboard.html' : 'index.html');
      } catch (error) {
        errorBox.textContent = authErrorText(error);
        errorBox.hidden = false;
        button.disabled = false;
        button.textContent = t('auth.login');
      }
    });
  </script>
</body>
</html>
