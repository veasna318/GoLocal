<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | GoLocal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container form-page">
    <div class="form-card">
      <h1 data-i18n="auth.loginTitle">Welcome back</h1>
      <p data-i18n="auth.loginSub"></p>

      <form id="login-form">
        <div class="alert alert-error" id="form-error" hidden></div>

        <div class="field">
          <label for="email" data-i18n="auth.email">Email</label>
          <input class="input" type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="field">
          <label for="password" data-i18n="auth.password">Password</label>
          <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-green btn-block" id="submit-button" data-i18n="auth.login">Log in</button>
      </form>

      <p class="form-footer">
        <span data-i18n="auth.noAccount">No account yet?</span>
        <a href="signup.html" data-i18n="auth.signup">Sign up</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('form-error');
    const button = document.getElementById('submit-button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      button.disabled = true;
      button.textContent = t('auth.working');

      try {
        await signIn(form.email.value.trim(), form.password.value);
        const next = new URLSearchParams(location.search).get('next');
        location.href = next || (isSeller() || isAdmin() ? 'dashboard.html' : 'index.html');
      } catch (error) {
        errorBox.textContent = authErrorText(error);
        errorBox.hidden = false;
        button.disabled = false;
        button.textContent = t('auth.login');
      }
    });
  </script>
</body>
</html>
